<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG mønster</title>
    <style>
        svg {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 360">
    <circle cx="100" cy="100" r="50" fill="hsl(0,50%,50%)" />
    <rect x="150" y="50" width="200" height="100" fill="hsl(45,50%,50%)" />
    <circle cx="400" cy="100" r="50" fill="hsl(90,50%,50%)" />
    <rect x="350" y="150" width="100" height="200" fill="hsl(135,50%,50%)" />
    <circle cx="745" cy="305" r="50" fill="hsl(180,50%,50%)" /> <!--nederst til høyre -->
   <rect x="300" y="318" width="200" height="40" fill="hsl(225,50%,50%)" /> <!-- nederst i midten -->
   <circle cx="52" cy="309" r="50" fill="hsl(270,50%,50%)" /> <!-- nederst til venstre -->
    <rect x="10" y="90" width="75" height="200" fill="hsl(315,50%,50%)" /><!-- i midten til venstre -->
</svg>
</body>
</html>
